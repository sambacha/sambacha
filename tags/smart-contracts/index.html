/*
 * Wrap inline code samples otherwise they shoot of the side and
 * can't be read at all.
 */

 code {
	white-space: pre-wrap;
	word-wrap: break-word;
	padding: 2px 5px;
}

/**
* Make code blocks display as blocks and give them the appropriate
* font size and padding.
*
*/

pre code {
white-space: pre;
word-wrap: normal;
display: block;
padding: 12px;
font-size: 12px;
}

/*
* Fix links to have dotted lines instead of normal underline only.
*
*/

a {
text-decoration-style: dotted;
}

a:hover {
text-decoration-thickness: 2px;
}

/*
* Fix link colors when the link text is inline code.
*
*/

a code {
	color: #2980B9;
}
a:hover code {
	color: #3091d1;
}
a:visited code {
	color: #9B59B6;
}

/*
* Enforce CSS classes from highlight.js with theme
*
*/

pre .cs, pre .c {
	font-weight: inherit;
	font-style: inherit;
}

/*
* Fixes issues with non-highlighted code samples.
*
*/

.no-highlight {
display: block;
padding: 0.5em;
color: #333;
}

/*
* Add some display code to prevent the $ from being copied
*
*```bash
* <screen>
*!    <prompt>$ <prompt>git clone https://github.com/$USR/$REPO.git
* </screen>
*```
*
*/

.prompt {
	user-select: none;
	-moz-user-select: none;
}

/*
* Diff Support
* @usage
* <link href="https://unpkg.com/prismjs@1.20.0/themes/prism-okaidia.css" rel="stylesheet">
*
*/

.token.deleted {
background-color: hsl(350deg 100% 88% / 47%);
}
.token.inserted {
background-color: hsl(120deg 73% 75% / 35%);
}

/*
* Make the + and - characters unselectable for copy/paste
*
*/

.token.prefix.unchanged,
.token.prefix.inserted,
.token.prefix.deleted {
-webkit-user-select: none;
user-select: none;
}

/*
* Optional: full-width background color
*
*/

.token.inserted:not(.prefix),
.token.deleted:not(.prefix) {
display: block;
}
